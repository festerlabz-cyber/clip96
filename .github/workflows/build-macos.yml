name: Build macOS (AU + VST3)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel   # arm64 Mac runners were unavailable for this repo; the build is universal either way
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal: Apple Silicon + Intel)"
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Sign (ad-hoc, for own use)
        run: |
          AU="build/Clip96_artefacts/Release/AU/Clip 96.component"
          VST3="build/Clip96_artefacts/Release/VST3/Clip 96.vst3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$VST3"
          lipo -info "$AU/Contents/MacOS/Clip 96"

      - name: Validate with Apple auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/Clip96_artefacts/Release/AU/Clip 96.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Btbt" || true
          auval -v aufx Cl96 Btbt

      - name: Package DMG
        run: |
          VERSION=$(grep -E "^project\(Clip96 VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          SHORT=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp -R "build/Clip96_artefacts/Release/AU/Clip 96.component" dist/
          cp -R "build/Clip96_artefacts/Release/VST3/Clip 96.vst3" dist/
          cp packaging/install.sh dist/install.sh
          cp packaging/LEESMIJ.txt dist/LEESMIJ.txt
          hdiutil create -volname "Clip 96" -srcfolder dist -ov -format UDZO "Clip96-$VERSION-$SHORT.dmg"
          echo "DMG_NAME=Clip96-$VERSION-$SHORT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}.dmg
          retention-days: 30
